services:
  # ── MariaDB Database ─────────────────────────────────────────
  db:
    image: mariadb:10.6
    container_name: gameserver-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./GameServerApi/gamedb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"   # Chỉ bind localhost, KHÔNG expose ra ngoài
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gameserver-net

  # ── Game Server API (.NET 9) ────────────────────────────────
  api:
    build:
      context: ./GameServerApi
      dockerfile: Dockerfile
    container_name: gameserver-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__GameDB: "Server=db;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};Port=3306"
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: GameServerApi
      Jwt__Audience: GameClient
      ZoneApiKey: ${ZONE_API_KEY}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '' http://localhost:5000/ || [ $? -eq 22 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gameserver-net

  # ── Unity Dedicated Server ──────────────────────────────────
  # Unity server cần upload build Linux vào thư mục ./unity-server/
  # Xem README để biết cách build và upload
  unity:
    image: ubuntu:22.04
    container_name: gameserver-unity
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    network_mode: host
    working_dir: /app
    volumes:
      - ./unity-server/GameServer:/app
      - unity_logs:/var/log
    environment:
      VPS_IP: ${VPS_IP}
      GAME_PORT: ${GAME_SERVER_PORT}
      API_URL: http://localhost:5000/api
      JWT_SECRET: ${JWT_SECRET}
      ZONE_API_KEY: ${ZONE_API_KEY}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update -qq && apt-get install -y -qq libgdiplus libc6-dev > /dev/null 2>&1
        mkdir -p /app/GameServer_Data/StreamingAssets
        echo "{\"apiBaseUrl\":\"http://localhost:5000\",\"gameServerIp\":\"$$VPS_IP\",\"gameServerPort\":$$GAME_PORT}" > /app/GameServer_Data/StreamingAssets/server_config.json
        echo "Starting Unity Dedicated Server on port $$GAME_PORT..."
        exec /app/GameServer.x86_64 -batchmode -nographics --port=$$GAME_PORT --publicIp=$$VPS_IP --apiUrl=$$API_URL

volumes:
  db_data:
    driver: local
  unity_logs:
    driver: local

networks:
  gameserver-net:
    driver: bridge
